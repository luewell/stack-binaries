# Builds Valkey for macOS, which nobody publishes.
#
# Run it for a version, then take the digest it prints into the catalogue entry
# in the stack repository.
name: Valkey for macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Valkey version to build, without the leading v
        required: true
        default: "9.1.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    # macos-14 and later are Apple silicon. This project supports no Intel Macs.
    runs-on: macos-14
    # A build takes under a minute; GitHub's default ceiling is six hours.
    timeout-minutes: 30
    steps:
      - name: Refuse a version that is not a release number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the version must be a release like 9.1.1, without the leading v" >&2
            exit 1
          fi

      # Pinned to a commit rather than a tag. A tag moves, and official is a
      # much smaller risk than a third party's, not no risk. v5 also drops the
      # deprecated Node 20.
      - name: Check out Valkey
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: valkey-io/valkey
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Check it does not depend on where it was built
        run: |
          set -euo pipefail
          # A binary naming an absolute library path can only ever be installed
          # where it was built. DBngin's Redis hardcodes
          # /Users/Shared/DBngin/... and is pinned to that directory for ever;
          # stack installs per version under the user's state directory.
          if otool -L src/valkey-server | grep -qE '^[[:space:]]+/(Users|opt|usr/local)/'; then
            echo "valkey-server links against a path outside the system:" >&2
            otool -L src/valkey-server >&2
            echo "link statically or through @loader_path before shipping this" >&2
            exit 1
          fi
          otool -L src/valkey-server

      - name: Package in the layout the catalogue expects
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          root="valkey-${VERSION}-macos-arm64"
          mkdir -p "${root}/bin"
          cp src/valkey-server src/valkey-cli "${root}/bin/"

          # An arm64 binary without at least an ad-hoc signature is killed by
          # the kernel. The linker signs its own output, but copying can drop it.
          codesign --force --sign - "${root}/bin/valkey-server"
          codesign --force --sign - "${root}/bin/valkey-cli"

          tar -czf "${root}.tar.gz" "${root}"
          digest="$(shasum -a 256 "${root}.tar.gz" | awk '{print $1}')"

          echo "archive=${root}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "SHA-256 for the catalogue entry: ${digest}"

      - name: Check it runs
        env:
          VERSION: ${{ inputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/valkey-${VERSION}-macos-arm64/bin/valkey-server" --version

      - name: Hand the archive to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valkey-macos-arm64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # The only job that can write to this repository. The build runs Valkey's own
  # make, so this one checks nothing out and runs nothing it produced; it only
  # moves the archive into the release.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Take the archive the build produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: valkey-macos-arm64

      # Published with the CLI the runner already carries, rather than a
      # third-party action: publishing needs write access to this repository,
      # and that is not a permission to hand to code we do not control.
      #
      # The name and digest are worked out here from the validated version and
      # the file itself, not taken from the build, whose outputs its code wrote.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="valkey-${VERSION}-macos-arm64.tar.gz"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          gh release create "valkey-${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Valkey ${VERSION} for macOS" \
            --notes "Built from valkey-io/valkey ${VERSION} on macOS arm64, because upstream publishes no macOS binary.

          SHA-256: \`${digest}\`" \
            "$archive"
