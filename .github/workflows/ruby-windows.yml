# Repackages RubyInstaller's Windows builds as zips.
#
# RubyInstaller publishes a relocatable Ruby for Windows only as a 7z, which
# Stack does not extract. This unpacks the upstream archive, whose digest
# ruby-windows-upstream.json pins, and packs the same tree unchanged into a
# zip, the same bytes for the same input on the same runner image. Run it for a version listed there,
# then take the digests it prints into the catalogue entry.
name: Ruby for Windows

run-name: Ruby ${{ inputs.version }} for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Ruby release to repackage, such as 3.4.10
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  repackage:
    # Windows, to run what it packed; 7-Zip and Python are on the image.
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse a version that is not a release number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the version must be a release like 3.4.10" >&2
            exit 1
          fi

      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The digests come from this repository, reviewed, not from the release
      # the archives are downloaded from. A version without an ARM64 build
      # pins only x64. jq ends its lines with CRLF on Windows.
      - name: Download the upstream builds
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          architectures="$(jq -r --arg version "$VERSION" '.[$version] // {} | keys[]' ruby-windows-upstream.json | tr -d '\r')"
          if [ -z "$architectures" ]; then
            echo "ruby-windows-upstream.json pins no build of ${VERSION}" >&2
            exit 1
          fi

          for architecture in $architectures; do
            expected="$(jq -r --arg version "$VERSION" --arg architecture "$architecture" '.[$version][$architecture]' ruby-windows-upstream.json | tr -d '\r')"
            upstream="rubyinstaller-${VERSION}-1-${architecture}.7z"
            curl -fsSL --proto '=https' --proto-redir '=https' -o "$upstream" \
              "https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-${VERSION}-1/${upstream}"
            printf '%s  %s\n' "$expected" "$upstream" | sha256sum --check --strict
          done

      - name: Pack each into a zip
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for upstream in rubyinstaller-"${VERSION}"-1-*.7z; do
            architecture="${upstream%.7z}"
            architecture="${architecture##*-}"
            case "$architecture" in
              x64) platform=x86_64 ;;
              arm) platform=arm64 ;;
              *) echo "unknown architecture ${architecture}" >&2; exit 1 ;;
            esac

            unpacked="unpacked-${architecture}"
            "/c/Program Files/7-Zip/7z.exe" x -bd -y "-o${unpacked}" "$upstream" > /dev/null
            python - "$unpacked/rubyinstaller-${VERSION}-1-${architecture}" "ruby-${VERSION}-windows-${platform}" <<'PYTHON'
          import os
          import sys
          import zipfile

          source, root = sys.argv[1], sys.argv[2]
          names = []
          for directory, subdirectories, files in os.walk(source):
              subdirectories.sort()
              for name in sorted(files):
                  names.append(os.path.join(directory, name))

          # Fixed dates and order: the same upstream archive gives the same bytes.
          with zipfile.ZipFile(root + ".zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in names:
                  relative = os.path.relpath(path, source).replace(os.sep, "/")
                  entry = zipfile.ZipInfo(root + "/" + relative, date_time=(1980, 1, 1, 0, 0, 0))
                  entry.compress_type = zipfile.ZIP_DEFLATED
                  entry.external_attr = 0o644 << 16
                  with open(path, "rb") as file:
                      archive.writestr(entry, file.read())
          PYTHON
            echo "SHA-256 for the catalogue entry (windows ${platform}): $(sha256sum "ruby-${VERSION}-windows-${platform}.zip" | awk '{print $1}')"
          done

      - name: Check the x64 build runs from its zip
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Expand-Archive "ruby-$env:VERSION-windows-x86_64.zip" -DestinationPath $env:RUNNER_TEMP
          $bin = "$env:RUNNER_TEMP\ruby-$env:VERSION-windows-x86_64\bin"
          $reported = & "$bin\ruby.exe" -e 'print RUBY_VERSION'
          if ($reported -ne $env:VERSION) { Write-Error "the zip runs Ruby $reported, not $env:VERSION"; exit 1 }
          & "$bin\gem.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin\ruby.exe" -ropenssl -rpsych -e 'puts OpenSSL::OPENSSL_LIBRARY_VERSION'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hand the archives to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruby-windows
          path: ruby-${{ inputs.version }}-windows-*.zip
          if-no-files-found: error

  # The only job that can write to this repository. It checks nothing out and
  # runs nothing the repackaging produced; it only moves the zips into a
  # release.
  release:
    needs: repackage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Take the archives the repackaging produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ruby-windows
          path: archives

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(archives/ruby-"${VERSION}"-windows-*.zip)
          [ "${#archives[@]}" -gt 0 ] || { echo "no archive was produced" >&2; exit 1; }

          notes="RubyInstaller ${VERSION}-1 for Windows, unchanged, repacked from its 7z into a zip, because Stack extracts no 7z."
          for archive in "${archives[@]}"; do
            notes="${notes}

          $(basename "$archive"): \`$(sha256sum "$archive" | awk '{print $1}')\`"
          done
          gh release create "ruby-${VERSION}-windows" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ruby ${VERSION} for Windows" \
            --notes "$notes" \
            "${archives[@]}"
