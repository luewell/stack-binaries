# Builds PHP, which nobody publishes with the database drivers a Laravel project
# needs: the public static builds leave out pdo_pgsql and pdo_mysql.
#
# Run it for a version, then take the digests it prints into the catalogue entry
# in the stack repository.
name: PHP

on:
  workflow_dispatch:
    inputs:
      version:
        description: PHP version to build, as a line like 8.4 or a release like 8.4.25
        required: true
        default: "8.4"

permissions:
  contents: write

env:
  # Pinned to a release and to the sha256 GitHub publishes for each asset. spc
  # is a PHP program, so building it here would mean building PHP to build PHP.
  SPC_VERSION: "2.8.5"

jobs:
  # The release is made once, before the builds, so three jobs uploading to it
  # never race to create it. Asked for rather than forced: an exit status that
  # means both "already there" and "something went wrong" cannot be branched on.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The tag names the exact release, never the line. A catalogue entry pins
      # a URL, and "php-8.4" would quietly become a different build the day 8.4.26
      # comes out. php.net resolves a line to the release inside it, so the
      # answer is known before anything is built.
      - name: Resolve the version and create the release if it is not there
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asked="${{ inputs.version }}"

          resolved="$(curl -fsSL "https://www.php.net/releases/index.php?json&version=${asked}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"

          case "$resolved" in
            "$asked"|"$asked".*) ;;
            *)
              echo "php.net resolved ${asked} to ${resolved}, which is not inside it" >&2
              exit 1
              ;;
          esac

          tag="php-${resolved}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${resolved}" >> "$GITHUB_OUTPUT"
          echo "${asked} is ${resolved}"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "${tag} is already there"
            exit 0
          fi
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "PHP ${resolved}" \
            --notes "Built with static-php-cli ${SPC_VERSION}, because upstream publishes no build carrying the database drivers.

          Each asset's SHA-256 is in the job that produced it."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and later are Apple silicon. This project supports no Intel Macs.
          - runner: macos-14
            platform: macos-arm64
            spc: spc-macos-aarch64.tar.gz
            digest: acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225
          - runner: ubuntu-24.04
            platform: linux-x86_64
            spc: spc-linux-x86_64.tar.gz
            digest: 523ba4279c54c7a377156c0dd3a36adf92ee64b01e9a7f5e9e2ec084b8e458e5
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            spc: spc-linux-aarch64.tar.gz
            digest: 675a3840dcdc4ed041fe20eaa54310ce019a9984c1c03951df9ec66df5795213

    runs-on: ${{ matrix.runner }}
    # PHP is a long build; GitHub's default ceiling is six hours.
    timeout-minutes: 120
    steps:
      # Pinned to a commit rather than a tag. A tag moves, and this job holds
      # write access to this repository; official is a much smaller risk than a
      # third party's, not no risk.
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Sources and built libraries are kept between runs. Without this every
      # retry recompiles OpenSSL, ICU and the rest from nothing.
      #
      # The key covers what decides their content: the spc release, the
      # extension set, the PHP line and the platform.
      - name: Reuse what was already downloaded and built
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            downloads
            buildroot
            source
          key: spc-${{ env.SPC_VERSION }}-php-${{ inputs.version }}-${{ matrix.platform }}-${{ hashFiles('craft.yml') }}

      - name: Fetch static-php-cli, and refuse it if it is not what we pinned
        run: |
          set -euo pipefail
          curl -fsSL -o "${{ matrix.spc }}" \
            "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/${{ matrix.spc }}"

          if command -v shasum >/dev/null 2>&1; then
            actual="$(shasum -a 256 "${{ matrix.spc }}" | awk '{print $1}')"
          else
            actual="$(sha256sum "${{ matrix.spc }}" | awk '{print $1}')"
          fi

          if [ "$actual" != "${{ matrix.digest }}" ]; then
            echo "spc ${SPC_VERSION} is not what we pinned:" >&2
            echo "  expected ${{ matrix.digest }}" >&2
            echo "  got      ${actual}" >&2
            exit 1
          fi

          tar -xzf "${{ matrix.spc }}"
          chmod +x spc
          ./spc --version

      - name: Build
        env:
          # spc asks api.github.com which version of each library to take, and
          # an unauthenticated runner is refused with a 403 once the shared
          # allowance is gone. The token only reads public metadata here.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the version line is rewritten; the extension set is reviewed in
          # craft.yml and is the same for every version and platform.
          if [ "$RUNNER_OS" = macOS ]; then
            /usr/bin/sed -i '' "s/^php-version: .*/php-version: \"${{ inputs.version }}\"/" craft.yml
          else
            sed -i "s/^php-version: .*/php-version: \"${{ inputs.version }}\"/" craft.yml
          fi
          ./spc craft craft.yml

      - name: Check it does not depend on where it was built
        run: |
          set -euo pipefail
          # A binary naming an absolute library path can only ever be installed
          # where it was built. DBngin's Redis hardcodes /Users/Shared/DBngin/...
          # and is pinned to that directory for ever.
          for binary in buildroot/bin/php buildroot/bin/php-fpm; do
            if [ "$RUNNER_OS" = macOS ]; then
              if otool -L "$binary" | grep -qE '^[[:space:]]+/(Users|opt|usr/local)/'; then
                echo "${binary} links against a path outside the system:" >&2
                otool -L "$binary" >&2
                exit 1
              fi
              otool -L "$binary"
            else
              # A static build has no interpreter at all, which is what we want;
              # a dynamic one must name nothing under a build directory.
              if ldd "$binary" 2>&1 | grep -qE '/(home|root|__w)/'; then
                echo "${binary} links against a path outside the system:" >&2
                ldd "$binary" >&2
                exit 1
              fi
              ldd "$binary" 2>&1 || true
            fi
          done

      - name: Check every extension we asked for is really there
        run: |
          set -euo pipefail
          buildroot/bin/php -m | tr 'A-Z' 'a-z' | sort -u > present.txt

          # Laravel's own list, plus the drivers it does not name and the public
          # static builds leave out. A build missing one of these is not shipped.
          missing=""
          for extension in ctype curl dom fileinfo filter hash mbstring openssl \
                           pcre pdo session tokenizer xml \
                           pdo_pgsql pdo_mysql redis intl zip gd bcmath sodium; do
            grep -qx "$extension" present.txt || missing="${missing} ${extension}"
          done

          if [ -n "$missing" ]; then
            echo "the build is missing:${missing}" >&2
            buildroot/bin/php -m >&2
            exit 1
          fi
          echo "all required extensions present"
          buildroot/bin/php -v

      - name: Check php-fpm starts and listens
        run: |
          set -euo pipefail
          # A full FastCGI round trip needs a web server, so it is asserted in
          # the stack repository where Caddy already runs. Here it must at least
          # accept its configuration and hold the port.
          #
          # error_log is not optional: without it php-fpm defaults to a path
          # under /var/log and refuses to start when it cannot open it.
          printf '[global]\ndaemonize = no\nerror_log = %s\n[www]\nlisten = 127.0.0.1:9000\npm = static\npm.max_children = 1\n' \
            "$RUNNER_TEMP/php-fpm.log" > "$RUNNER_TEMP/php-fpm.conf"

          buildroot/bin/php-fpm -t -y "$RUNNER_TEMP/php-fpm.conf"
          buildroot/bin/php-fpm -y "$RUNNER_TEMP/php-fpm.conf" &
          fpm_pid=$!

          listening=no
          for _ in $(seq 1 20); do
            if nc -z 127.0.0.1 9000 2>/dev/null; then listening=yes; break; fi
            sleep 0.5
          done
          kill "$fpm_pid" || true
          [ "$listening" = yes ] || { echo "php-fpm never listened" >&2; exit 1; }
          echo "php-fpm accepted its configuration and held the port"

      - name: Package in the layout the catalogue expects
        id: package
        run: |
          set -euo pipefail
          version="$(buildroot/bin/php -r 'echo PHP_VERSION;')"
          root="php-${version}-${{ matrix.platform }}"
          mkdir -p "${root}/bin"
          cp buildroot/bin/php buildroot/bin/php-fpm "${root}/bin/"

          if [ "$RUNNER_OS" = macOS ]; then
            # An arm64 binary without at least an ad-hoc signature is killed by
            # the kernel. The linker signs its own output, but copying can drop it.
            codesign --force --sign - "${root}/bin/php"
            codesign --force --sign - "${root}/bin/php-fpm"
            digest_of() { shasum -a 256 "$1" | awk '{print $1}'; }
          else
            digest_of() { sha256sum "$1" | awk '{print $1}'; }
          fi

          tar -czf "${root}.tar.gz" "${root}"
          digest="$(digest_of "${root}.tar.gz")"

          if [ "$version" != "${{ needs.prepare.outputs.version }}" ]; then
            echo "built ${version} where the release is for ${{ needs.prepare.outputs.version }}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${root}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "root=${root}" >> "$GITHUB_OUTPUT"
          echo "SHA-256 for the catalogue entry (${{ matrix.platform }}): ${digest}"

      - name: Check it runs after being packed and unpacked
        run: |
          set -euo pipefail
          tar -xzf "${{ steps.package.outputs.archive }}" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${{ steps.package.outputs.root }}/bin/php" --version

      # Uploaded with the CLI the runner already carries, rather than a
      # third-party action: publishing needs write access to this repository,
      # and that is not a permission to hand to code we do not control.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            --repo "${{ github.repository }}" --clobber
