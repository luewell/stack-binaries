# Builds PHP for Windows with the same extensions as the other platforms.
#
# The official Windows builds keep each extension in a DLL that only a php.ini
# naming it loads, and carry no redis; static-php-cli links them all into
# php.exe, as on macOS and Linux. Windows has no php-fpm, so php-cgi.exe, which
# speaks FastCGI there, ships instead. Run it for a release the catalogue
# already pins, then take the digest it prints into that entry.
name: PHP for Windows

run-name: PHP ${{ inputs.version }} for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: PHP release to build, like 8.4.25
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  SPC_VERSION: "2.8.5"
  SPC_DIGEST: 425b54ab857e21409c1fd9b818899ffebabd1e2817ef0a0ed5ae8a3d9f5b463b

jobs:
  build:
    # x64: static-php-cli builds for no other Windows, and Windows on ARM runs
    # this one under emulation. windows-2022 because spc finds Visual Studio
    # only at the 2019 and 2022 install paths.
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      ROOT: php-${{ inputs.version }}-windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      # An exact release rather than a line: the release this makes sits beside
      # the one php.yml made for the same version, and the catalogue pins both.
      - name: Refuse a version that is not a release number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the version must be a release like 8.4.25" >&2
            exit 1
          fi

      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Reuse what was already downloaded and built
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            downloads
            buildroot
            source
          key: spc-${{ env.SPC_VERSION }}-php-${{ inputs.version }}-windows-x86_64-${{ hashFiles('craft.yml', 'php-windows-intl.php') }}

      - name: Fetch static-php-cli, and refuse it if it is not what we pinned
        run: |
          set -euo pipefail
          curl -fsSL -o spc.exe \
            "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/spc-windows-x64.exe"

          actual="$(sha256sum spc.exe | awk '{print $1}')"
          if [ "$actual" != "$SPC_DIGEST" ]; then
            echo "spc ${SPC_VERSION} is not what we pinned:" >&2
            echo "  expected ${SPC_DIGEST}" >&2
            echo "  got      ${actual}" >&2
            exit 1
          fi
          ./spc.exe --version

      # craft.yml stays the one extension set; Windows leaves out the two
      # extensions that exist only on Unix, builds cgi where it has no fpm, and
      # patches intl before 8.4 (php-windows-intl.php).
      - name: Derive the Windows craft from craft.yml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -e "s/^php-version: .*/php-version: \"${VERSION}\"/" \
              -e 's/^  - fpm$/  - cgi/' \
              -e '/^  - pcntl$/d' \
              -e '/^  - posix$/d' \
              craft.yml > craft-windows.yml

          printf 'build-options:\n  with-added-patch:\n    - php-windows-intl.php\n' >> craft-windows.yml

          if grep -qE '^  - (fpm|pcntl|posix)$' craft-windows.yml || ! grep -qx '  - cgi' craft-windows.yml; then
            echo "craft.yml no longer has the shape this step rewrites:" >&2
            cat craft-windows.yml >&2
            exit 1
          fi
          cat craft-windows.yml

      # spc unpacks sources through the tar on PATH, and Git's GNU tar reads
      # D:\ as a remote host; Windows' own tar is the one it expects.
      - name: Build
        shell: pwsh
        env:
          # spc asks api.github.com which version of each library to take; the
          # token is read-only and only reads public metadata here.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          .\spc.exe craft craft-windows.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # spc keeps the compiler's output in its logs rather than on the console.
      - name: Keep spc's logs when the build fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spc-logs
          path: log
          if-no-files-found: ignore

      # Saved as soon as the build is done, so a check failing after it does not
      # cost the next run the build.
      - name: Keep what was downloaded and built
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            downloads
            buildroot
            source
          key: spc-${{ env.SPC_VERSION }}-php-${{ inputs.version }}-windows-x86_64-${{ hashFiles('craft.yml', 'php-windows-intl.php') }}

      # spc links pgsql and pdo_pgsql against the libpq.dll of EnterpriseDB's
      # PostgreSQL binaries, which it builds against; that DLL and what it
      # loads in turn ship beside php.exe, where Windows looks first. Anything
      # else must be Windows' own or the Visual C++ runtime, which libpq.dll
      # needs and which, as for the official PHP builds, is installed rather
      # than shipped: the runner has it in System32, a fresh Windows has not.
      - name: Gather php.exe and the libraries it loads
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $postgres = Get-ChildItem downloads -Filter 'postgresql-*-windows-x64-binaries.zip' | Select-Object -First 1
          $postgresBin = 'source\postgresql-win\bin'
          $visualCRuntime = '^(vcruntime140(_1)?|msvcp140(_\w+)?|concrt140)\.dll$'

          New-Item -ItemType Directory -Path "$env:ROOT\bin" | Out-Null
          Copy-Item buildroot\bin\php.exe, buildroot\bin\php-cgi.exe "$env:ROOT\bin"

          $bundled = [ordered]@{}
          $runtime = [Collections.Generic.SortedSet[string]]::new()
          $pending = [Collections.Generic.Queue[string]]::new()
          $pending.Enqueue("$env:ROOT\bin\php.exe")
          $pending.Enqueue("$env:ROOT\bin\php-cgi.exe")
          while ($pending.Count -gt 0) {
            $binary = $pending.Dequeue()
            $dependents = & $dumpbin /nologo /dependents $binary |
              Where-Object { $_ -match '^\s+\S+\.dll$' } |
              ForEach-Object { $_.Trim().ToLowerInvariant() }
            "$(Split-Path $binary -Leaf): $($dependents -join ' ')"

            foreach ($dependent in $dependents) {
              if ($dependent -like 'api-ms-win-*' -or $bundled.Contains($dependent)) { continue }
              if ($dependent -match $visualCRuntime) { [void]$runtime.Add($dependent); continue }
              if (Test-Path "$env:SystemRoot\System32\$dependent") { continue }

              $source = Get-ChildItem $postgresBin -Filter $dependent | Select-Object -First 1
              if (-not $source) { Write-Error "$binary loads $dependent, which neither Windows nor $($postgres.Name) carries"; exit 1 }
              Copy-Item $source.FullName "$env:ROOT\bin"
              $bundled[$dependent] = $true
              $pending.Enqueue("$env:ROOT\bin\$dependent")
            }
          }

          "bundled from $($postgres.Name): $($bundled.Keys -join ' ')"

          # The notice below names these libraries and their licenses.
          $named = 'libcrypto-3-x64.dll libiconv-2.dll libintl-9.dll libpq.dll libssl-3-x64.dll libwinpthread-1.dll'
          if ((@($bundled.Keys) | Sort-Object) -join ' ' -ne $named) {
            Write-Error "the bundled libraries are no longer the ones the notice names ($named); update it"
            exit 1
          }
          "needs the Visual C++ runtime: $($runtime -join ' ')"
          @(
            "The DLLs in bin beside php.exe and php-cgi.exe other than those two come unchanged"
            "from EnterpriseDB's $($postgres.Name), https://www.enterprisedb.com/download-postgresql-binaries,"
            "because the pgsql and pdo_pgsql extensions link its libpq:"
            ""
            ($bundled.Keys | ForEach-Object { "  $_" })
            ""
            "libpq is PostgreSQL's client library, under the PostgreSQL License. libssl and libcrypto"
            "are OpenSSL 3, under the Apache License 2.0. libintl is GNU gettext's and libiconv GNU"
            "libiconv, both under the LGPL 2.1 or later. libwinpthread is mingw-w64's winpthreads,"
            "under the MIT License. Each project publishes its license and sources: postgresql.org,"
            "openssl.org, gnu.org/software/gettext, gnu.org/software/libiconv and mingw-w64.org."
            "They need the Visual C++ 2015-2022 runtime, which is not included."
          ) | Set-Content "$env:ROOT\NOTICE-libraries.txt"

      - name: Check every extension we asked for is really there
        run: |
          set -euo pipefail
          php="$ROOT/bin/php.exe"
          "$php" -m | tr -d '\r' | tr 'A-Z' 'a-z' | sort -u > present.txt

          missing=""
          for extension in ctype curl dom fileinfo filter hash mbstring openssl \
                           pcre pdo session tokenizer xml \
                           pdo_pgsql pdo_mysql redis intl zip gd bcmath sodium; do
            grep -qx "$extension" present.txt || missing="${missing} ${extension}"
          done

          if [ -n "$missing" ]; then
            echo "the build is missing:${missing}" >&2
            "$php" -m >&2
            exit 1
          fi
          echo "all required extensions present"
          "$php" -v

          "$php" -r '
            $wanted = ["JPEG Support", "PNG Support", "WebP Support", "FreeType Support"];
            $gd = gd_info();
            $missing = array_values(array_filter($wanted, fn ($feature) => empty($gd[$feature])));
            if ($missing) {
              fwrite(STDERR, "gd was built without: " . implode(", ", $missing) . PHP_EOL);
              print_r($gd);
              exit(1);
            }
            echo "gd carries ", implode(", ", $wanted), PHP_EOL;
          '

      - name: Check php-cgi listens for FastCGI
        shell: pwsh
        run: |
          $cgi = Start-Process -FilePath "$env:ROOT\bin\php-cgi.exe" -ArgumentList '-b', '127.0.0.1:9000' -PassThru -NoNewWindow
          $listening = $false
          foreach ($attempt in 1..20) {
            try {
              $client = [Net.Sockets.TcpClient]::new('127.0.0.1', 9000)
              $client.Dispose()
              $listening = $true
              break
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          Stop-Process -Id $cgi.Id -Force
          if (-not $listening) { Write-Error 'php-cgi never listened'; exit 1 }
          'php-cgi held the port'

      - name: Package in the layout the catalogue expects
        id: package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $built = & "$env:ROOT\bin\php.exe" -r 'echo PHP_VERSION;'
          if ($built -ne $env:VERSION) { Write-Error "built $built where the release is for $env:VERSION"; exit 1 }

          Compress-Archive -Path $env:ROOT -DestinationPath "$env:ROOT.zip"
          $digest = (Get-FileHash "$env:ROOT.zip" -Algorithm SHA256).Hash.ToLower()
          "archive=$env:ROOT.zip" >> $env:GITHUB_OUTPUT
          "SHA-256 for the catalogue entry: $digest"

      - name: Check it runs after being packed and unpacked
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          Expand-Archive $env:ARCHIVE -DestinationPath $env:RUNNER_TEMP
          $modules = & "$env:RUNNER_TEMP\$env:ROOT\bin\php.exe" -m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($modules -notcontains 'pdo_pgsql') { Write-Error 'the unpacked php.exe has no pdo_pgsql'; exit 1 }
          'the unpacked php.exe loads pdo_pgsql'

      - name: Hand the archive to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-windows-x86_64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # The only job that can write to this repository. It checks nothing out and
  # runs nothing the build produced; it only moves the archive into a release
  # of its own, since the release php.yml made for the version takes no new
  # asset once published.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Take the archive the build produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: php-windows-x86_64

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="php-${VERSION}-windows-x86_64.zip"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          gh release create "php-${VERSION}-windows" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PHP ${VERSION} for Windows" \
            --notes "Built with static-php-cli ${SPC_VERSION} on Windows x64, with the extensions of the other platforms' builds but pcntl and posix, which exist only on Unix. php-cgi.exe serves FastCGI, since Windows has no php-fpm.

          SHA-256: \`${digest}\`" \
            "$archive"
